<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #071b29, #123c35);
    font-family: Arial, sans-serif;
    color: white;
    padding: 15px;
}

.game-container {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    text-align: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

h1 {
    color: #58ff9c;
    margin-bottom: 8px;
    font-size: 32px;
}

.subtitle {
    color: #c8ded8;
    margin-bottom: 18px;
    font-size: 14px;
}

.scoreboard {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.score-box {
    flex: 1;
    background: #102c32;
    padding: 12px;
    border-radius: 12px;
}

.score-box p {
    font-size: 12px;
    color: #b6d2cb;
    margin-bottom: 5px;
}

.score-box span {
    font-size: 23px;
    font-weight: bold;
    color: #58ff9c;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #071a20;
    border: 2px solid #3b765f;
    border-radius: 12px;
    touch-action: none;
}

#message {
    min-height: 22px;
    margin: 12px 0;
    color: #ffe783;
    font-size: 14px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
}

#startBtn {
    background: #58ff9c;
    color: #073326;
}

#pauseBtn {
    background: #f4d35e;
    color: #302800;
}

.controls {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3, 58px);
    justify-content: center;
    gap: 8px;
}

.controls button {
    height: 48px;
    padding: 0;
    font-size: 23px;
    background: #214b4b;
    color: white;
    border: 1px solid #467d70;
}

.controls button:active {
    background: #58a889;
}

.controls .empty {
    visibility: hidden;
}

.help {
    margin-top: 15px;
    font-size: 12px;
    color: #b6d2cb;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="game-container">
    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Eat food • Grow longer • Beat your record!</p>

    <div class="scoreboard">
        <div class="score-box">
            <p>SCORE</p>
            <span id="score">0</span>
        </div>

        <div class="score-box">
            <p>HIGH SCORE</p>
            <span id="highScore">0</span>
        </div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <p id="message">Press Start Game to play!</p>

    <div class="buttons">
        <button id="startBtn">▶ Start Game</button>
        <button id="pauseBtn">⏸ Pause</button>
    </div>

    <div class="controls">
        <button class="empty"> </button>
        <button data-dir="up">⬆️</button>
        <button class="empty"> </button>

        <button data-dir="left">⬅️</button>
        <button data-dir="down">⬇️</button>
        <button data-dir="right">➡️</button>
    </div>

    <p class="help">
        Computer: Use Arrow Keys or WASD<br>
        Mobile: Use the buttons above<br>
        Press Space to Pause or Resume
    </p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");

const grid = 20;
const cells = canvas.width / grid;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let timer = null;
let running = false;
let paused = false;
let gameOver = false;

let highScore = 0;

try {
    highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
} catch (e) {}

highScoreElement.textContent = highScore;

function resetGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };

    score = 0;
    scoreElement.textContent = score;

    running = false;
    paused = false;
    gameOver = false;

    clearInterval(timer);
    timer = null;

    spawnFood();
    draw();

    startBtn.textContent = "▶ Start Game";
    pauseBtn.textContent = "⏸ Pause";
    message.textContent = "Press Start Game to play!";
}

function spawnFood() {
    do {
        food = {
            x: Math.floor(Math.random() * cells),
            y: Math.floor(Math.random() * cells)
        };
    } while (
        snake && snake.some(part =>
            part.x === food.x && part.y === food.y
        )
    );
}

function draw() {
    ctx.fillStyle = "#071a20";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw grid
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= cells; i++) {
        ctx.beginPath();
        ctx.moveTo(i * grid, 0);
        ctx.lineTo(i * grid, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * grid);
        ctx.lineTo(canvas.width, i * grid);
        ctx.stroke();
    }

    // Draw food
    ctx.fillStyle = "#ff5263";
    ctx.beginPath();
    ctx.arc(
        food.x * grid + grid / 2,
        food.y * grid + grid / 2,
        grid * 0.38,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Food glow
    ctx.fillStyle = "#ffb3bb";
    ctx.beginPath();
    ctx.arc(
        food.x * grid + grid / 2 - 3,
        food.y * grid + grid / 2 - 3,
        3,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#8affb6" : "#36c878";

        ctx.beginPath();
        ctx.roundRect(
            part.x * grid + 1,
            part.y * grid + 1,
            grid - 2,
            grid - 2,
            5
        );
        ctx.fill();

        if (index === 0) {
            drawEyes(part);
        }
    });

    if (paused || gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = gameOver ? "#ff7885" : "#ffe783";
        ctx.font = "bold 30px Arial";

        ctx.fillText(
            gameOver ? "GAME OVER!" : "PAUSED",
            canvas.width / 2,
            canvas.height / 2
        );

        ctx.font = "16px Arial";
        ctx.fillStyle = "#ffffff";

        ctx.fillText(
            gameOver ? "Tap Start to play again" : "Press Space to resume",
            canvas.width / 2,
            canvas.height / 2 + 30
        );
    }
}

function drawEyes(head) {
    const centerX = head.x * grid + grid / 2;
    const centerY = head.y * grid + grid / 2;

    let eye1, eye2;

    if (direction.x === 1) {
        eye1 = { x: centerX + 4, y: centerY - 5 };
        eye2 = { x: centerX + 4, y: centerY + 5 };
    } else if (direction.x === -1) {
        eye1 = { x: centerX - 4, y: centerY - 5 };
        eye2 = { x: centerX - 4, y: centerY + 5 };
    } else if (direction.y === -1) {
        eye1 = { x: centerX - 5, y: centerY - 4 };
        eye2 = { x: centerX + 5, y: centerY - 4 };
    } else {
        eye1 = { x: centerX - 5, y: centerY + 4 };
        eye2 = { x: centerX + 5, y: centerY + 4 };
    }

    ctx.fillStyle = "#073326";

    [eye1, eye2].forEach(eye => {
        ctx.beginPath();
        ctx.arc(eye.x, eye.y, 2, 0, Math.PI * 2);
        ctx.fill();
    });
}

function changeDirection(dir) {
    if (dir === "up" && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
    } else if (dir === "down" && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
    } else if (dir === "left" && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
    } else if (dir === "right" && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
    }
}

function gameLoop() {
    if (!running || paused || gameOver) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    const ateFood = head.x === food.x && head.y === food.y;

    // Check collision with wall
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= cells ||
        head.y >= cells
    ) {
        endGame();
        return;
    }

    // When not eating, the tail moves away this turn.
    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);

    // Check collision with snake body
    if (bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ateFood) {
        score += 10;
        scoreElement.textContent = score;

        if (score > highScore) {
            highScore = score;
            highScoreElement.textContent = highScore;

            try {
                localStorage.setItem("snakeHighScore", highScore);
            } catch (e) {}
        }

        spawnFood();
    } else {
        snake.pop();
    }

    draw();
}

function startGame() {
    if (running && !gameOver) {
        if (paused) {
            paused = false;
            pauseBtn.textContent = "⏸ Pause";
            message.textContent = "Keep playing!";
            draw();
        }
        return;
    }

    resetGame();
    running = true;

    startBtn.textContent = "🔄 Restart";
    message.textContent = "Good luck! Eat the red food.";

    timer = setInterval(gameLoop, 120);
}

function togglePause() {
    if (!running || gameOver) return;

    paused = !paused;

    pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
    message.textContent = paused ? "Game paused." : "Keep playing!";

    draw();
}

function endGame() {
    running = false;
    gameOver = true;

    clearInterval(timer);
    timer = null;

    message.textContent = "Game over! Your score: " + score;
    startBtn.textContent = "🔄 Play Again";

    draw();
}

document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    const keys = [
        "arrowup", "arrowdown", "arrowleft", "arrowright",
        "w", "a", "s", "d", " "
    ];

    if (keys.includes(key)) {
        event.preventDefault();
    }

    if (key === "arrowup" || key === "w") changeDirection("up");
    if (key === "arrowdown" || key === "s") changeDirection("down");
    if (key === "arrowleft" || key === "a") changeDirection("left");
    if (key === "arrowright" || key === "d") changeDirection("right");

    if (key === " ") {
        if (running && !gameOver) {
            togglePause();
        }
    }
});

document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("click", () => {
        changeDirection(button.dataset.dir);
    });
});

startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", togglePause);

// Allow swiping on the game board on mobile.
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", event => {
    const touch = event.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
}, { passive: true });

canvas.addEventListener("touchend", event => {
    const touch = event.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        changeDirection(dx > 0 ? "right" : "left");
    } else {
        changeDirection(dy > 0 ? "down" : "up");
    }
}, { passive: true });

resetGame();
</script>

</body>
  </html>
